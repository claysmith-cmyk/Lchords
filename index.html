<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b24"><title>Chord Quest — Make a little magic</title>
  <link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Chord Quest home"><span class="brand-icon">♬</span> chord<span>quest</span></a>
    <nav aria-label="Main navigation"><button class="nav active" data-page="adventure">Adventure</button><button class="nav" data-page="collection">Chord book</button></nav>
    <div class="header-right"><span class="xp" id="xp">✦ 0 XP</span><button id="midi-connect" class="device"><span class="status-dot"></span><span id="midi-label">Connect keyboard</span></button></div>
  </header>
  <main id="home">
    <section class="hero">
      <div class="hero-copy"><h1>Make a little<br><em>chord magic.</em></h1><button id="continue" class="primary">Start playing <span>↗</span></button></div>
      <svg class="landscape" viewBox="0 0 640 380" role="img" aria-label="A little musical traveler on a glowing island beneath the moon">
        <defs><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#4c8273"/><stop offset="1" stop-color="#234943"/></linearGradient><linearGradient id="rock" x2="0" y2="1"><stop stop-color="#233c40"/><stop offset="1" stop-color="#162931"/></linearGradient><radialGradient id="glow"><stop stop-color="#eedb99" stop-opacity=".19"/><stop offset="1" stop-color="#eedb99" stop-opacity="0"/></radialGradient></defs>
        <circle cx="370" cy="147" r="168" fill="url(#glow)"/><circle cx="410" cy="76" r="39" fill="#f0dfae"/><circle cx="421" cy="65" r="38" fill="#253737"/>
        <g fill="#e4d197"><path d="M196 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M511 149l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><circle cx="288" cy="43" r="2"/><circle cx="464" cy="30" r="2"/><circle cx="552" cy="84" r="2"/><circle cx="138" cy="137" r="2"/></g>
        <path d="M111 258Q188 177 265 219L347 165 497 213 551 261 358 318 208 306z" fill="url(#rock)"/><path d="M111 258L208 306 296 360 358 318 551 261 403 288 267 287z" fill="#182c33"/>
        <path d="M111 258Q183 195 253 219Q303 231 347 187Q407 178 497 231L551 261Q449 301 369 276Q243 304 111 258" fill="url(#hill)"/>
        <path d="M283 281Q396 254 316 244Q257 231 352 214" fill="none" stroke="#b2b383" stroke-width="13"/>
        <g fill="#376553"><path d="M169 228v-74l-31 48h19l-29 28z"/><path d="M197 220v-92l-36 57h20l-30 39z"/><path d="M464 242v-93l-39 57h24l-36 37z"/></g><g fill="#568367"><path d="M197 128l36 57h-20l30 39-46-4z"/><path d="M464 149l36 57h-21l33 37-48-1z"/></g>
        <g transform="translate(338 178)"><ellipse cx="0" cy="46" rx="25" ry="6" fill="#203e39"/><path d="M-14 10Q0-2 14 10l7 30q-22 12-42 0z" fill="#ebaf72"/><path d="M-14 11Q-12-19 0-19Q16-18 15 11" fill="#f0cf98"/><ellipse cx="1" cy="0" rx="10" ry="9" fill="#384844"/><circle cx="-2" cy="-1" r="1.5" fill="#fff0ba"/><circle cx="5" cy="-1" r="1.5" fill="#fff0ba"/><path d="M-8 44v9m17-9v9" stroke="#c38b62" stroke-width="5"/><path d="M18 18l10 10" stroke="#f0cf98" stroke-width="5"/><path d="M29 12v35" stroke="#c5a674" stroke-width="3"/><path d="M29 6l7 7-7 7-7-7z" fill="#f8da87"/></g>
        <g fill="#c8d79b"><circle cx="228" cy="263" r="3"/><circle cx="410" cy="251" r="3"/><path d="M139 256l4-11 4 11m323 9 4-11 4 11"/></g><g fill="#dfd49e" font-family="Georgia" font-size="25"><text x="265" y="148" transform="rotate(-14 265 148)">♪</text><text x="390" y="153" transform="rotate(12 390 153)">♫</text></g>
      </svg>
    </section>
    <section class="dashboard-strip" aria-label="Your progress"><div><span class="metric-icon">◈</span><span><strong id="learned">0 / 60</strong><small>Chords</small></span></div><div><span class="metric-icon warm">⚑</span><span><strong id="level-count">0 / 20</strong><small>Lessons</small></span></div><div><span class="metric-icon purple">↻</span><span><strong id="due-count">0 ready</strong><small>Review</small></span></div><button id="review" class="secondary">Memory garden <span>→</span></button></section>
    <section id="adventure-page"><div class="section-heading"><h2>Your adventure</h2></div><div id="worlds" class="worlds"></div><section class="lesson-panel"><div class="world-detail"><h2 id="world-name"></h2><div class="formula" id="world-formula"></div></div><div id="lessons" class="lesson-list"></div></section><section class="side-quests"><button id="arcade" class="secondary">Spark sprint · 90 seconds ↗</button></section></section>
    <section id="collection-page" hidden><div class="section-heading"><h2>Chord book</h2><label>Family <select id="book-family"></select></label></div><div id="chord-book" class="chord-book"></div></section>
    <footer><button id="help">How to play</button></footer>
  </main>
  <main id="play" hidden><div class="play-top"><button id="exit" class="secondary">← Adventure</button><span id="session-title"></span><span id="session-score">✦ 0 XP</span></div><div class="progress-track"><div id="session-progress"></div></div><div class="arena" id="arena"><div class="eyebrow" id="prompt-kind"></div><h1 id="chord-name"></h1><p id="prompt-description"></p><div id="note-chips" class="note-chips"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="play-actions"><button id="listen" class="secondary">♫ Hear chord</button><button id="hint" class="secondary">Show hint</button><button id="next" class="primary" hidden>Keep going →</button></div></div><section class="instrument"><div class="instrument-heading"><span id="input-label">PIANO</span><span id="held-notes">Play the notes together</span><label><input type="checkbox" id="sound" checked> Sound</label></div><div class="audio-bar"><button id="audio-enable" class="secondary">Test sound</button><span id="audio-status" role="status">Audio paused</span></div><div id="piano" class="piano" aria-label="Playable piano"></div><div class="piano-caption"><button id="clear-notes">Release all notes</button><span>Click keys to hold notes</span></div><div class="submit-row"><button id="check" class="primary">Check chord <kbd>Enter</kbd></button></div></section></main>
  <dialog id="dialog"><button id="close-dialog" class="close-dialog" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog><div id="toast" role="status" hidden></div>
</body>
</html>
